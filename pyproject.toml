[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-run"
version = "0.1.1"
description = "Boot a disk image under QEMU, drive its console, return program output and exit code"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["diskrun"]
script-files = ["bin/disk-run"]

[tool.pytest.ini_options]
testpaths = ["tests"]
