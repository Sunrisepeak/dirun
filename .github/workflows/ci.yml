name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XLINGS_NON_INTERACTIVE: '1'
  # The build pins, one place (mirrors the ecosystem's setup action shape).
  MCPP_VERSION: 2026.11.12.1
  XLINGS_VERSION: v2026.10.26.1
  LLVM_VERSION: 23.1.3

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: Install xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install the pinned mcpp and LLVM
        shell: bash
        run: |
          set -euo pipefail
          # The runners sit next to github.com; the CN mirror of the package
          # index lags main by minutes, so pin the global mirror before any
          # index-touching step.
          xlings config --mirror GLOBAL 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "xim:mcpp@$MCPP_VERSION" -y -g; then break; fi
            if [ "$attempt" = 5 ]; then echo "::error::mcpp@$MCPP_VERSION could not be installed"; exit 1; fi
            sleep 30
          done
          xlings use mcpp "$MCPP_VERSION" 2>/dev/null || true
          mcpp self version
          for attempt in 1 2 3; do
            if mcpp toolchain install llvm "$LLVM_VERSION"; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 30
          done
          mcpp toolchain default "llvm@$LLVM_VERSION"

      - name: Build
        shell: bash
        run: mcpp build

      - name: The suite (the contract's statuses against a console played by a child; no emulator)
        shell: bash
        run: mcpp test

      - name: The entry answers
        shell: bash
        run: |
          mcpp run dirun -- --help > /dev/null
          mcpp run dirun -- --version

  # The program as it is released: one package for every system, the ok images of both
  # architectures with a launcher and each system's okrun.
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install xlings
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: Install the pinned mcpp
        run: |
          set -euo pipefail
          xlings config --mirror GLOBAL 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "xim:mcpp@$MCPP_VERSION" -y -g; then break; fi
            if [ "$attempt" = 5 ]; then echo "::error::mcpp@$MCPP_VERSION could not be installed"; exit 1; fi
            sleep 30
          done
      - name: The program for every system
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' mcpp.toml | head -1)
          mcpp pack dirun --target openkal --mode self-contained --systems all --pkg-format tar -o target/dist/
          package="dirun-$version-openkal-bundle-all"
          mkdir -p dist unpacked
          cp "target/dist/$package.tar.gz" dist/
          tar -xzf "dist/$package.tar.gz" -C unpacked
          said=$("unpacked/$package/bin/dirun" --version)
          [ "$said" = "$version" ] || { echo "::error::the packaged program says '$said', the manifest $version"; exit 1; }
          python3 - "unpacked/$package/mcpp-package.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          want = {"linux-x86_64", "linux-aarch64", "macos-aarch64", "windows-x86_64"}
          assert want <= set(d["runs_on"]["self"]), d["runs_on"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist
