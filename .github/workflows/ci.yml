name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build pins, one place; mcpp-community/setup-mcpp installs them.
  MCPP_VERSION: 2026.11.16.1
  LLVM_VERSION: 23.1.3

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - uses: mcpp-community/setup-mcpp@v1
        with:
          version: ${{ env.MCPP_VERSION }}
          toolchains: llvm ${{ env.LLVM_VERSION }}
      - name: The default toolchain
        shell: bash
        run: mcpp toolchain default "llvm@$LLVM_VERSION"

      # The FAT disk's test reads the disk with mtools and fsck.fat where they are present.
      - name: mtools and dosfstools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends mtools dosfstools

      - name: Build
        shell: bash
        run: mcpp build

      - name: The suite (the contract's statuses against a console played by a child; no emulator)
        shell: bash
        run: mcpp test

      - name: The entry answers
        shell: bash
        run: |
          mcpp run dirun -- --help > /dev/null
          mcpp run dirun -- --version

  # The program as it is released: one package for every system, the ok images of both
  # architectures with a launcher and each system's okrun.
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: mcpp-community/setup-mcpp@v1
        with:
          version: ${{ env.MCPP_VERSION }}
      - name: The program for every system
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' mcpp.toml | head -1)
          mcpp pack dirun --target openkal --mode self-contained --systems all --pkg-format tar -o target/dist/
          package="dirun-$version-openkal-bundle-all"
          mkdir -p dist unpacked
          cp "target/dist/$package.tar.gz" dist/
          tar -xzf "dist/$package.tar.gz" -C unpacked
          said=$("unpacked/$package/bin/dirun" --version)
          [ "$said" = "$version" ] || { echo "::error::the packaged program says '$said', the manifest $version"; exit 1; }
          # Started through a path with `//` and `..`, as a user's shell may name it: the launcher
          # hands okrun the image by that path, which okrun normalises (N12).
          said=$("unpacked//$package/bin/../bin/dirun" --version)
          [ "$said" = "$version" ] || { echo "::error::started through '//' and '..', the package says '$said'"; exit 1; }
          python3 - "unpacked/$package/mcpp-package.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          want = {"linux-x86_64", "linux-aarch64", "macos-aarch64", "windows-x86_64"}
          assert want <= set(d["runs_on"]["self"]), d["runs_on"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist
