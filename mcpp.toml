# dirun: the native implementation (the Python under tools/reference/ is the frozen
# specification of the contract, not the program users run).
#
# Split by dependency set, the way the workspace idiom asks:
#
#   modules/protocol   the marker protocol: pure text, no system in it
#   modules/console    the console driver: expect/send over a pty (posix today)
#   modules/runner     qemu invocation, the overlay, the file disk, exit codes
#   modules/testing    the minimal test protocol the suite reports through
#
# The root package stays the program, so `mcpp build` and `mcpp test` mean the
# program and its suite; a member is reached with `-p`, `--workspace` reaches all.
[workspace]
members = [
    "modules/protocol",
    "modules/console",
    "modules/runner",
    "modules/testing",
]

# One version of each third-party package for every member.
[workspace.dependencies.mcpplibs]
os = "0.3.0"

[workspace.dependencies.nlohmann]
json = "3.12.0"

[package]
name        = "dirun"
version     = "0.2.0"
description = "Boot a disk image, drive its console, return the program's output and exit code"
license     = "Apache-2.0"
[workspace.toolchain]
default = "llvm@23.1.3"
[build]
sources = ["src/*.cppm"]

[targets.dirun]
kind = "bin"
main = "src/main.cpp"


[dependencies]
dirun-protocol = { path = "modules/protocol" }
dirun-console  = { path = "modules/console" }
dirun-runner   = { path = "modules/runner" }

[dev-dependencies]
dirun-testing = { path = "modules/testing" }
