# The console driver: expect/send over a pty. The default login script below is
# one policy, replaceable whole through the runner's --expect; this module knows
# no system. The pty itself is a thin native layer (posix today; a system whose
# mcpplibs.os has no pty face gets a clear not-built error, never a silent miss).
[package]
name        = "dirun-console"
version     = "0.2.0"
description = "Console driving for dirun: expect/send primitives over a pty channel"
license     = "Apache-2.0"

[targets.dirun-console]
kind = "lib"

[lib]
path = "src/console.cppm"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

# The pty: openpty, the select loop, the process group. POSIX only.
[target.'cfg(not(os = "windows"))'.build]
sources = ["src/native/posix/pty.cpp"]

# No pty face here yet: the same entry points, defined to say so at run time.
[target.windows.build]
sources = ["src/native/windows/pty.cpp"]

[dependencies]
dirun-protocol = { path = "../protocol" }

[dependencies.nlohmann]
json.workspace = true

[dev-dependencies]
dirun-testing = { path = "../testing" }
